---
- id: CMD-0028
  key: certificateAuthoritiesFilePermissions
  title: Client certificate authorities file permissions
  nodeType: worker
  audit: >-
    stat -c %a $(ps -eo args |
    awk -v bin="$kubelet.bins" 'BEGIN {n=split(bin, parts, " ")}
    {name=$1; sub(/^.*\//, "", name); if (!n || name != parts[1]) next;
    for (i=2; i<=n; i++) if ($i != parts[i]) next; print}' |
    grep 'client-ca-file' |
    grep -o 'client-ca-file=[^"]\S*' |
    awk -F "=" '{print $2}' |
    awk 'FNR <= 1') 2> /dev/null
  platforms:
    - k8s
    - rke2
