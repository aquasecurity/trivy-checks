---
- id: CMD-0045
  key: kubeletOnlyUseStrongCryptographic
  title: Kubelet only makes use of Strong Cryptographic
  nodeType: worker
  audit: >-
    ps -eo args |
    awk -v bin="$kubelet.bins" 'BEGIN {n=split(bin, parts, " ")}
    {name=$1; sub(/^.*\//, "", name); if (!n || name != parts[1]) next;
    for (i=2; i<=n; i++) if ($i != parts[i]) next; print}' |
    grep 'TLSCipherSuites' |
    grep -o 'TLSCipherSuites=[^"]\S*' |
    awk -F "=" '{print $2}' |
    awk 'FNR <= 1'
  platforms:
    - k8s
    - rke2
