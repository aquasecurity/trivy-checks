rules:
  # GitHub environments are not currently used, so secrets are accessed outside of them.
  # See: https://docs.zizmor.sh/audits/#secrets-outside-env
  secrets-outside-env:
    disable: true
  # The zizmor version in use does not support workflow dependency lockfiles.
  # See: https://github.com/zizmorcore/zizmor/issues/2477
  unpinned-uses:
    disable: true
